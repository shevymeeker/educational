<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title>Prism</title>

    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0c0f1a;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            color: #cdd6e8;
            min-height: 100vh;
        }

        /* ── Layout shell ── */
        .container {
            display: flex;
            flex-direction: row;
            justify-content: center;
            padding: 0 20px;
        }

        .container-inner {
            width: 100%;
            max-width: 540px;
        }

        .vertical-space-manager {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 1rem;
        }

        /* ── Game card ── */
        .game-player {
            background: #111520;
            border: 1px solid #1c2236;
            border-radius: 22px;
            padding: 36px 28px 40px;
            overflow: hidden;
            position: relative;
            margin-top: 40px;
        }

        /* Decorative top border shimmer */
        .game-player::before {
            content: '';
            position: absolute;
            top: 0;
            left: 10%;
            right: 10%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(139, 92, 246, 0.6), transparent);
        }

        /* ── Headings ── */
        .game-title {
            text-align: center;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 2px;
            color: #f0f4ff;
            margin-bottom: 8px;
        }

        #game-description {
            text-align: center;
            font-size: 13px;
            line-height: 1.7;
            color: #4e5c7a;
            margin-bottom: 0;
        }

        /* ── Start button ── */
        #start-button-container {
            width: 100%;
            display: flex;
            flex-direction: row;
            justify-content: center;
            margin-top: 28px;
        }

        .start-button-container-disabled {
            opacity: 0;
            pointer-events: none;
        }

        #start-button {
            background: linear-gradient(135deg, #6d28d9, #8b5cf6);
            color: #fff;
            padding: 13px 36px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 1px;
            transition: opacity 0.2s, transform 0.15s;
            box-shadow: 0 4px 20px rgba(139, 92, 246, 0.35);
        }

        #start-button:hover {
            opacity: 0.85;
            transform: translateY(-1px);
        }

        /* ── Level info ── */
        #current-level-info {
            margin-top: 28px;
        }

        #current-level-number-display {
            text-align: center;
            font-size: 13px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #8b5cf6;
            margin-bottom: 20px;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .current-level-number-display-enabled {
            opacity: 1 !important;
        }

        #current-level-guesses-message {
            text-align: center;
            font-size: 13px;
            color: #4e5c7a;
            letter-spacing: 1px;
            margin-bottom: 16px;
            min-height: 1.5em;
        }

        /* Progress dots row */
        #current-level-guesses-display {
            display: flex;
            flex-direction: row;
            justify-content: center;
            gap: 6px;
            flex-wrap: wrap;
            min-height: 24px;
        }

        .current-correct-guess-panel {
            width: 18px;
            height: 18px;
            border-radius: 5px;
            transition: all 0.15s;
            flex-shrink: 0;
        }

        /* ── Central flash panel ── */
        #random-panel-container {
            width: 100%;
            display: flex;
            flex-direction: row;
            justify-content: center;
            margin-top: 28px;
        }

        #random-panel {
            width: 160px;
            height: 160px;
            border-radius: 22px;
            background: #191e2e;
            border: 2px solid #1c2236;
            transition: background 0.08s, box-shadow 0.08s;
        }

        .random-panel-none {
            display: none !important;
        }

        /* Color glow states for the flash panel */
        #random-panel.bg-red {
            box-shadow: 0 0 40px rgba(244, 63, 94, 0.55);
        }
        #random-panel.bg-yellow {
            box-shadow: 0 0 40px rgba(245, 158, 11, 0.55);
        }
        #random-panel.bg-green {
            box-shadow: 0 0 40px rgba(16, 185, 129, 0.55);
        }
        #random-panel.bg-purple {
            box-shadow: 0 0 40px rgba(139, 92, 246, 0.55);
        }

        /* ── Controls ── */
        #controls {
            margin-top: 32px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
        }

        .controls-enabled {
            opacity: 1 !important;
            pointer-events: all !important;
        }

        #controls-instructions {
            text-align: center;
            font-size: 12px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: #3d4e6a;
            margin-bottom: 20px;
        }

        #controls-btns-row {
            margin-top: 8px;
            display: flex;
            flex-direction: row;
            gap: 12px;
        }

        .controls-btn {
            flex: 1;
            aspect-ratio: 1;
            border-radius: 16px;
            cursor: pointer;
            transition: opacity 0.15s, transform 0.12s, box-shadow 0.15s;
            border: none;
        }

        .controls-btn:hover {
            opacity: 0.82;
            transform: translateY(-2px);
        }

        .controls-btn:active {
            transform: scale(0.93);
            opacity: 1;
        }

        /* ── Game over ── */
        #game-over-container {
            margin-top: 28px;
            display: none;
        }

        .game-over-container-visible {
            display: block !important;
        }

        #game-over-message {
            text-align: center;
            font-size: 15px;
            line-height: 1.9;
            color: #f43f5e;
            margin-bottom: 16px;
        }

        #game-over-correct-solution {
            display: flex;
            flex-direction: row;
            justify-content: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        /* ── Four signal colors ── */
        .bg-red    { background-color: #f43f5e; }
        .bg-yellow { background-color: #f59e0b; }
        .bg-green  { background-color: #10b981; }
        .bg-purple { background-color: #8b5cf6; }

        /* Glow on the control buttons */
        #controls-btn-red    { box-shadow: 0 4px 18px rgba(244, 63, 94, 0.3);  }
        #controls-btn-yellow { box-shadow: 0 4px 18px rgba(245, 158, 11, 0.3); }
        #controls-btn-green  { box-shadow: 0 4px 18px rgba(16, 185, 129, 0.3); }
        #controls-btn-purple { box-shadow: 0 4px 18px rgba(139, 92, 246, 0.3); }

        #controls-btn-red:hover    { box-shadow: 0 6px 28px rgba(244, 63, 94, 0.55);  }
        #controls-btn-yellow:hover { box-shadow: 0 6px 28px rgba(245, 158, 11, 0.55); }
        #controls-btn-green:hover  { box-shadow: 0 6px 28px rgba(16, 185, 129, 0.55); }
        #controls-btn-purple:hover { box-shadow: 0 6px 28px rgba(139, 92, 246, 0.55); }
    </style>
</head>

<body>
<div>
    <div class="container">
        <div class="container-inner">
            <div class="vertical-space-manager">
                <div></div>

                <div class="game-player">
                    <h1 class="game-title">Prism</h1>
                    <h5 id="game-description">
                        Watch the sequence. Lock it in.<br/><br/>
                        Each round adds one more signal — and they come faster.
                    </h5>

                    <div id="start-button-container">
                        <button id="start-button">Begin Sequence</button>
                    </div>

                    <div id="current-level-info">
                        <div>
                            <h3 id="current-level-number-display"></h3>
                        </div>

                        <div>
                            <h3 id="current-level-guesses-message"></h3>
                            <div id="current-level-guesses-display"></div>
                        </div>
                    </div>

                    <div id="random-panel-container">
                        <div id="random-panel"></div>
                    </div>

                    <div id="controls">
                        <div>
                            <h3 id="controls-instructions">Replay the sequence</h3>
                        </div>

                        <div id="controls-btns-row">
                            <div id="controls-btn-red"    class="controls-btn bg-red"></div>
                            <div id="controls-btn-yellow" class="controls-btn bg-yellow"></div>
                            <div id="controls-btn-green"  class="controls-btn bg-green"></div>
                            <div id="controls-btn-purple" class="controls-btn bg-purple"></div>
                        </div>
                    </div>

                    <div id="game-over-container">
                        <h2 id="game-over-message">
                            Sequence broken.<br/><br/>
                            Hit Begin to try again.<br/><br/>
                            Correct order:
                        </h2>
                        <div id="game-over-correct-solution"></div>
                    </div>
                </div>

                <div></div>
            </div>
        </div>
    </div>
</div>

<script>
    /* I wrote this all during a flight, so don't critique it too hard! */

    console.log("Not trying to cheat, are you?");

    let levelFlashingInProgress = false;
    let level = 0;
    const baseRounds = 4;
    const baseTime = 1000;
    const levelSpeedMod = 65;

    let currentBg;
    let currentLevelBgs = [];
    let currentLevelGuesses = [];
    let currentIteration = 0;

    const startButtonContainer = document.getElementById("start-button-container");
    const startButton = document.getElementById("start-button");
    const currentLevelNumberDisplay = document.getElementById("current-level-number-display");
    const currentLevelGuessesMessage = document.getElementById("current-level-guesses-message");
    const currentLevelGuessesDisplay = document.getElementById("current-level-guesses-display");
    const randomPanel = document.getElementById("random-panel");
    const controls = document.getElementById("controls");
    const gameOverContainer = document.getElementById("game-over-container");
    const gameOverCorrectSolution = document.getElementById("game-over-correct-solution");

    const controlsBtnRed = document.getElementById("controls-btn-red");
    const controlsBtnYellow = document.getElementById("controls-btn-yellow");
    const controlsBtnGreen = document.getElementById("controls-btn-green");
    const controlsBtnPurple = document.getElementById("controls-btn-purple");

    startButton.addEventListener("click", startLevel);

    controlsBtnRed.addEventListener("click", guessColor("bg-red"));
    controlsBtnYellow.addEventListener("click", guessColor("bg-yellow"));
    controlsBtnGreen.addEventListener("click", guessColor("bg-green"));
    controlsBtnPurple.addEventListener("click", guessColor("bg-purple"));

    function getRandomNumberInclusive(lower, upper) {
        return Math.floor(Math.random() * (upper + 1) - lower);
    }

    function getClassNameFromNumber(number) {
        switch(number) {
            case 0: return "bg-red";
            case 1: return "bg-yellow";
            case 2: return "bg-green";
            case 3:
            default: return "bg-purple";
        }
    }

    function startLevel() {
        if (levelFlashingInProgress) return;

        levelFlashingInProgress = true;
        currentLevelGuessesMessage.innerText = "";
        currentLevelGuessesDisplay.innerHTML = "";
        startButtonContainer.classList.add("start-button-container-disabled");
        gameOverContainer.classList.remove("game-over-container-visible");
        randomPanel.classList.remove("random-panel-none");
        currentLevelNumberDisplay.innerText = `Level ${level + 1}`;
        currentLevelNumberDisplay.classList.add("current-level-number-display-enabled");

        const intervalSpeed = baseTime - (level * levelSpeedMod * (((level * 100) / 1000) + 1));

        let workingClassName;

        const flashingInterval = setInterval(() => {
            if (workingClassName) {
                randomPanel.classList.remove(workingClassName);
            }

            workingClassName = getNewClass();
            currentBg = workingClassName;
            currentLevelBgs.push(currentBg);
            randomPanel.classList.add(workingClassName);
            currentIteration++;

            if (currentIteration === level + baseRounds) {
                clearInterval(flashingInterval);
                setTimeout(() => {
                    levelFlashingInProgress = false;
                    preparePlayingFieldForLevel();
                }, intervalSpeed);
            }
        }, intervalSpeed);
    }

    function preparePlayingFieldForLevel() {
        randomPanel.classList.forEach(c => randomPanel.classList.remove(c));
        randomPanel.classList.add("random-panel-none");
        controls.classList.add("controls-enabled");
        currentLevelGuessesMessage.innerText = getCurrentCorrectGuessesMessage();
    }

    function guessColor(color) {
        return () => {
            if (color === currentLevelBgs[currentLevelGuesses.length]) {
                currentLevelGuesses.push(color);
                currentLevelGuessesMessage.innerText = getCurrentCorrectGuessesMessage();
                getNewCurrentCorrectGuessesDisplay(color, currentLevelGuessesDisplay);

                if (currentLevelGuesses.length === currentLevelBgs.length) {
                    controls.classList.remove("controls-enabled");

                    setTimeout(() => {
                        currentBg = null;
                        currentLevelBgs = [];
                        currentLevelGuesses = [];
                        currentIteration = 0;
                        currentLevelGuessesMessage.innerText = "";
                        currentLevelGuessesDisplay.innerHTML = "";
                        level++;
                        startLevel();
                    }, 1000);
                }
            } else {
                console.log("you lose! (But there's really no winning, is there?)");
                gameOverContainer.classList.add("game-over-container-visible");
                randomPanel.classList.add("random-panel-none");
                currentLevelBgs.forEach(c => getNewCurrentCorrectGuessesDisplay(c, gameOverCorrectSolution));
                controls.classList.remove("controls-enabled");
                startButtonContainer.classList.remove("start-button-container-disabled");
                currentBg = null;
                currentLevelBgs = [];
                currentLevelGuesses = [];
                currentIteration = 0;
                level = 0;
            }
        }
    }

    function getCurrentCorrectGuessesMessage() {
        return `${currentLevelGuesses.length} / ${currentLevelBgs.length} correct`;
    }

    function getNewCurrentCorrectGuessesDisplay(className, parent) {
        const newPanel = document.createElement("div");
        newPanel.classList.add("current-correct-guess-panel");
        newPanel.classList.add(className);
        parent.append(newPanel);
    }

    function getNewClass() {
        const classNumber = getRandomNumberInclusive(0, 3);
        let workingClassName = getClassNameFromNumber(classNumber);

        if (currentBg === workingClassName) {
            workingClassName = getNewClass();
        }

        return workingClassName;
    }
</script>
</body>
</html>
