<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        function makeCookie() {
            let message = document.getElementById('message');
            message.innerHTML = cookieMessage();
        }

        function cookieMessage() {
            const OPTIONS = 36;
            let person;
            let char;
            let anim;
            let itm;

            switch (randomNumber(OPTIONS)) {
                case 0:  return `Make ${virtue()}, not ${misfortune()}.`;
                case 1:  return `The cure for ${misfortune()} is ${virtue()}.`;
                case 2:  person = personality(); return `${time()} you will meet ${article(person)} ${person} ${character()}.`;
                case 3:  char = character(); return `${startingPhrase()} ${article(char)} ${char} without ${virtue()} brings ${misfortune()}.`;
                case 4:  return `Replace ${misfortune()} with ${virtue()}.`;
                case 5:  return `Avoid ${personality()} people.`;
                case 6:  return `Your soul-mate's horoscope is the ${chineseHoroscope()}.`;
                case 7:  return `Be ${personality()} and you shall live with ${virtue()}.`;
                case 8:  return `Be ${personality()} and you shall have ${fortune()}.`;
                case 9:  return `${startingPhrase()} ${misfortune()} is bad.`;
                case 10: return `${time()} you shall have ${fortune()}.`;
                case 11: return `${startingPhrase()} ${vice()} does not bring ${fortune()}; ${virtue()} does.`;
                case 12: return `If you have ${vice()}, you will get no ${fortune()}.`;
                case 13: return `Fight ${vice()} with ${virtue()}.`;
                case 14: return `You have a strong desire for ${fortune()}.`;
                case 15: return `${time()} you should pursue your dreams.`;
                case 16: return `${time()} you will get a pet ${animal()}.`;
                case 17: anim = animal(); return `Your spirit animal is ${article(anim)} ${anim}.`;
                case 18: person = personality(); return `In your previous life you were ${article(person)} ${person} ${animal()}.`;
                case 19: anim = animal(); return `You have the ${virtue()} of ${article(anim)} ${anim}.`;
                case 20: person = personality(); return `${time()} you will face ${article(person)} ${person} ${character()}.`;
                case 21: return `Don't let ${vice()} get in the way of your ${fortune()}.`;
                case 22: person = personality(); return `${startingPhrase()} ${article(person)} ${person} army is sure to win.`;
                case 23: return `No ${character()} is perfect.`;
                case 24: return `In ${misfortune()}, we see true ${virtue()}.`;
                case 25: return `Serious ${misfortune()} will bypass you.`;
                case 26: return `Worry not, for ${misfortune()} is behind you. Ahead, you will find only ${fortune()}.`;
                case 27: return `${time()} ${misfortune()} will fall upon your country.`;
                case 28: return `${startingPhrase()} only those who dare to be ${personality()} get ${fortune()}.`;
                case 29: return `The ${personality()} will get ${virtue()}.`;
                case 30: return `${time()} a ${character()} will give you ${fortune()}.`;
                case 31: itm = item(); return `You will sell ${article(itm)} ${itm} for ${fortune()}.`;
                case 32: person = personality(); itm = item(); return `${time()} ${article(person)} ${person} ${character()} will give you ${article(itm)} ${itm}.`;
                case 33: char = character(); itm = item(); return `Give ${article(char)} ${char} in need some ${itm}.`;
                case 34: return `${startingPhrase()} ${fortune()} is worth more than some ${item()}.`;
                case 35: char = character(); return `${time()} ${article(char)} ${char} will steal your ${item()}.`;
                case 36: return `The ${personality()} shall inherit the ${fortune()}.`;
            }
        }

        function randomNumber(choiceNum) {
            let rng = Math.random();
            let rn = Math.floor(rng * choiceNum);
            return rn;
        }

        function selectFromList(list) {
            let options = list.length;
            let number = randomNumber(options);
            return list[number];
        }

        function article(word) {
            let vowelRegex = '^[aieou].*';
            let isVower = word.match(vowelRegex);
            return isVower ? 'an' : 'a';
        }

        function startingPhrase() {
            const LIST = [
                'It is known that', 'Remember,', 'A wise old man once said:', 'As a matter of fact,', 'I hate to say this, but',
                'There\'s no denying that', 'An old chinese proverb says:', 'By the way,'
            ];
            return selectFromList(LIST);
        }

        function virtue() {
            const LIST = [
                'wisdom', 'temperance', 'justice', 'humour', 'dignity',
                'mercy', 'gravity', 'humanity', 'selflessness', 'nobility',
                'chastity', 'temperance', 'charity', 'diligence', 'patience',
                'kindness', 'humility', 'sincerity', 'tranquility', 'empathy',
                'beauty',
            ];
            return selectFromList(LIST);
        }

        function vice() {
            const LIST = [
                'anger', 'arrogance', 'envy', 'gluttony', 'greed',
                'lust', 'sloth', 'cowardice', 'disloyalty', 'doubt',
                'injustice', 'jelousy', 'vanity', 'wrath',
            ];
            return selectFromList(LIST);
        }

        function misfortune() {
            const LIST = [
                'sickness', 'poverty', 'disaster', 'taxes', 'inequality',
                'war', 'conflict', 'hunger', 'trouble', 'drough',
                'plague', 'crime', 'unhappiness', 'misfortune',
            ];
            return selectFromList(LIST);
        }

        function fortune() {
            const LIST = [
                'fortune', 'wealth', 'love', 'friendship', 'cookies',
                'happiness', 'joy', 'gold', 'bitcoins',
            ];
            return selectFromList(LIST);
        }

        function time() {
            const LIST = [
                'Today', 'Tomorrow', 'Soon', 'Sometime', 'In the year of the ' + chineseHoroscope(),
            ];
            return selectFromList(LIST);
        }

        function chineseHoroscope() {
            const LIST = [
                'Rat', 'Ox', 'Tiger', 'Rabbit', 'Dragon', 'Snake',
                'Horse', 'Goat', 'Monkey', 'Rooster', 'Dog', 'Pig',
            ];
            return selectFromList(LIST);
        }

        function personality() {
            const LIST = [
                'adventurous', 'alert', 'athletic', 'balanced', 'brilliant',
                'calm', 'caring', 'charismatic', 'clever', 'creative',
                'curious', 'daring', 'dramatic', 'educated', 'empathetic',
                'fair', 'friendly', 'gentle', 'hardworking', 'happy',
                'humourous', 'kind', 'liberal', 'logical', 'mature',
                'loyal', 'modest', 'organized', 'patriotic', 'perfectionist',
                'popular', 'protective', 'relaxed', 'strong', 'sweet',
                'wise', 'agressive', 'ambitious', 'amusing', 'busy',
                'casual', 'complex', 'cute', 'invisible', 'political',
                'tough', 'unpatriotic', 'angry', 'anxious', 'barbaric',
                'crazy', 'cruel', 'cynical', 'dirty', 'dogmatic',
                'foolish', 'gloomy', 'grim', 'hostile', 'lazy',
                'odd', 'paranoid', 'shy', 'stupid', 'weak',
            ];
            return selectFromList(LIST);
        }

        function character() {
            const LIST = [
                'person', 'man', 'woman', 'boy', 'girl',
                'child', animal(),
            ];
            return selectFromList(LIST);
        }

        function animal() {
            const LIST = [
                'dolphin', 'cat', 'dog', 'giraffe', 'red panda',
                'wolf', 'tiger', 'elephant', 'monkey', 'horse',
                'panda', 'turtle', 'penguin',
            ];
            return selectFromList(LIST);
        }

        function item() {
            const LIST = [
                'book', 'coin', 'sword', 'fortune cookie', 'cup',
                'silk', 'camera', 'pen', 'scroll', 'ring',
                'toilet paper', 'ball', 'bell', 'drink', 'hammer',
                'essay', 'cheese', 'food',
            ];
            return selectFromList(LIST);
        }
    </script>

    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #08070f;
            color: #d4c9a8;
            font-family: Georgia, 'Times New Roman', serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* Star field via radial dot pattern */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                radial-gradient(1px 1px at 12% 18%, rgba(220, 200, 140, 0.55) 0%, transparent 100%),
                radial-gradient(1px 1px at 38% 7%,  rgba(220, 200, 140, 0.4)  0%, transparent 100%),
                radial-gradient(1px 1px at 63% 22%, rgba(220, 200, 140, 0.5)  0%, transparent 100%),
                radial-gradient(1px 1px at 82% 11%, rgba(220, 200, 140, 0.35) 0%, transparent 100%),
                radial-gradient(1px 1px at 5%  55%, rgba(220, 200, 140, 0.4)  0%, transparent 100%),
                radial-gradient(1px 1px at 91% 44%, rgba(220, 200, 140, 0.45) 0%, transparent 100%),
                radial-gradient(1px 1px at 27% 72%, rgba(220, 200, 140, 0.35) 0%, transparent 100%),
                radial-gradient(1px 1px at 74% 68%, rgba(220, 200, 140, 0.5)  0%, transparent 100%),
                radial-gradient(1px 1px at 48% 88%, rgba(220, 200, 140, 0.4)  0%, transparent 100%),
                radial-gradient(1px 1px at 19% 93%, rgba(220, 200, 140, 0.3)  0%, transparent 100%),
                radial-gradient(1.5px 1.5px at 55% 50%, rgba(220, 200, 140, 0.6) 0%, transparent 100%),
                radial-gradient(1px 1px at 88% 82%, rgba(220, 200, 140, 0.4)  0%, transparent 100%);
            pointer-events: none;
            z-index: 0;
        }

        /* Ambient vignette glow from center */
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse 60% 50% at 50% 50%, rgba(90, 60, 20, 0.12), transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        /* ── Page content ── */
        .page-content {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 560px;
            gap: 0;
        }

        /* ── Header ── */
        header {
            text-align: center;
            margin-bottom: 44px;
        }

        h1 {
            font-size: clamp(32px, 8vw, 52px);
            font-weight: 400;
            letter-spacing: 6px;
            color: #e8c96a;
            text-shadow: 0 0 40px rgba(232, 201, 106, 0.35);
            margin-bottom: 6px;
            font-style: italic;
        }

        .subtitle {
            font-size: 11px;
            letter-spacing: 5px;
            text-transform: uppercase;
            color: rgba(212, 185, 130, 0.45);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        /* ── Scroll / message area ── */
        .scroll-frame {
            width: 100%;
            background: rgba(20, 16, 8, 0.85);
            border: 1px solid rgba(200, 165, 75, 0.25);
            border-radius: 4px;
            padding: 40px 36px;
            position: relative;
            min-height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 36px;
        }

        /* Top and bottom decorative lines */
        .scroll-frame::before,
        .scroll-frame::after {
            content: '';
            position: absolute;
            left: 20px;
            right: 20px;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(200, 165, 75, 0.4), transparent);
        }
        .scroll-frame::before { top: 10px; }
        .scroll-frame::after  { bottom: 10px; }

        #message {
            font-size: clamp(15px, 3.5vw, 18px);
            font-style: italic;
            color: #e2d4aa;
            line-height: 1.75;
            text-align: center;
            text-shadow: 0 0 20px rgba(232, 201, 106, 0.2);
            min-height: 1.75em;
        }

        /* Placeholder text when empty */
        #message:empty::before {
            content: '— await the augur —';
            color: rgba(200, 165, 75, 0.25);
            font-size: 13px;
            letter-spacing: 3px;
        }

        /* ── Consult button ── */
        button {
            background: transparent;
            border: 1px solid rgba(200, 165, 75, 0.45);
            color: #c9a84c;
            font-size: 12px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            letter-spacing: 4px;
            text-transform: uppercase;
            padding: 14px 40px;
            border-radius: 3px;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s, color 0.2s, box-shadow 0.2s;
        }

        button:hover {
            background: rgba(200, 165, 75, 0.1);
            border-color: rgba(200, 165, 75, 0.7);
            color: #e8c96a;
            box-shadow: 0 0 24px rgba(200, 165, 75, 0.2);
        }

        button:active {
            background: rgba(200, 165, 75, 0.18);
        }

        /* ── Footer ── */
        footer {
            position: static;
            margin-top: 48px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-size: 10px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: rgba(200, 165, 75, 0.2);
            text-align: center;
        }

        @media (max-width: 480px) {
            .scroll-frame {
                padding: 32px 24px;
            }
            h1 {
                font-size: 30px;
            }
        }
    </style>

    <title>The Augur</title>
</head>
<body>
    <div class="page-content">
        <header>
            <h1>The Augur</h1>
            <div class="subtitle">what do the signs say</div>
        </header>

        <main>
            <div class="scroll-frame">
                <div id="message"></div>
            </div>
            <button onclick="makeCookie();">Consult the Augur</button>
        </main>

        <footer>
            <div>All fortunes are woven by algorithm.</div>
        </footer>
    </div>
</body>
</html>
